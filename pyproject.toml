[project]
name = "anygrab"
version = "1.0.0"
description = "Universal social media downloader — web UI + Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "yt-dlp",
    "pydantic>=2.5.2",
    "curl_cffi",
    "python-dotenv",
    "aiogram>=3.10",
    "aiosqlite",
    "aiohttp",
    "pyrogram",
    "tgcrypto",
    "python-multipart",
    "httpx>=0.28,<1",
    "google-auth>=2.40,<3",
    "requests>=2.32,<3",
    "cryptography>=46",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2,<2"]
test = ["pytest>=8", "pytest-cov>=6"]
